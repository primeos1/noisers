<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="b">
      <circle cx="16" cy="16" r="11"/>
    </clipPath>
  </defs>

  <!-- App-icon rounded background -->
  <rect width="32" height="32" rx="6" fill="#141418"/>

  <!-- Ball -->
  <circle cx="16" cy="16" r="11" fill="#f0f0f4"/>

  <!-- Football patch pattern, clipped to ball -->
  <g clip-path="url(#b)">
    <!-- Centre pentagon -->
    <polygon points="16,9.5 21,13 19.2,19 12.8,19 11,13" fill="#7c1d35"/>
    <!-- 5 seam lines from each corner to the ball edge -->
    <line x1="16"   y1="9.5" x2="16"  y2="-2"  stroke="#7c1d35" stroke-width="2" stroke-linecap="round"/>
    <line x1="21"   y1="13"  x2="31"  y2="7"    stroke="#7c1d35" stroke-width="2" stroke-linecap="round"/>
    <line x1="19.2" y1="19"  x2="27"  y2="28"   stroke="#7c1d35" stroke-width="2" stroke-linecap="round"/>
    <line x1="12.8" y1="19"  x2="5"   y2="28"   stroke="#7c1d35" stroke-width="2" stroke-linecap="round"/>
    <line x1="11"   y1="13"  x2="1"   y2="7"    stroke="#7c1d35" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ball border -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#7c1d35" stroke-width="1.5"/>
</svg>
